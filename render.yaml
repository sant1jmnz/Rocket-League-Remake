# One-click deploy on Render (https://render.com): New → Blueprint → pick this repository.
# A single Node web service serves the page and the WebSocket (/ws) on $PORT.
services:
  - type: web
    name: rocket-remake
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
